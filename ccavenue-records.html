<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCAvenue payments | Vorynex</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0b0f1a; color: #f4f4f5; font-family: Outfit, sans-serif; }
        main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
        h1 { font-size: 28px; margin-bottom: 8px; }
        p { color: #a1a1aa; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
        th { color: #a1a1aa; font-weight: 600; }
        .ok { color: #34d399; }
        .bad { color: #f87171; }
        .wait { color: #fbbf24; }
    </style>
</head>
<body>
<main>
    <h1>CCAvenue payments</h1>
    <p id="summary">Loading payment records…</p>
    <table>
        <thead>
        <tr>
            <th>When</th>
            <th>Order</th>
            <th>Plan</th>
            <th>Amount</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Tracking</th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
</main>
<script>
    function mark(status) {
        const value = (status || "").toUpperCase();
        if (value === "SUCCESS") return "ok";
        if (value === "FAILED") return "bad";
        return "wait";
    }

    fetch("/api/ccavenue-records")
        .then((response) => response.json())
        .then((rows) => {
            document.getElementById("summary").textContent = rows.length + " payment records";
            const body = document.getElementById("rows");
            rows.forEach((row) => {
                const tr = document.createElement("tr");
                tr.innerHTML = "<td>" + (row.createdAt || "") + "</td>"
                    + "<td>" + (row.orderId || "") + "</td>"
                    + "<td>" + (row.plan || "") + "</td>"
                    + "<td>₹" + (row.amount || "") + "</td>"
                    + "<td>" + (row.email || "") + "</td>"
                    + "<td>" + (row.phone || "") + "</td>"
                    + "<td class=\"" + mark(row.status) + "\">" + (row.status || "") + "</td>"
                    + "<td>" + (row.trackingId || "") + "</td>";
                body.appendChild(tr);
            });
        })
        .catch(() => {
            document.getElementById("summary").textContent = "Payment records could not be loaded.";
        });
</script>
</body>
</html>
